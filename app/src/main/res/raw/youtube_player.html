<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { margin:0; padding:0; }
    body { background:#000; width:100vw; height:100vh; }
    #player { width:100%; height:100%; }
  </style>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'VIDEO_ID_PLACEHOLDER',
        playerVars: { autoplay: 1, controls: 1, playsinline: 1, rel: 0 },
        events: {
          onReady: function(e) {
            Android.onPlayerReady(player.getDuration());
            e.target.playVideo();
          },
          onStateChange: function(e) { Android.onStateChange(e.data); },
          onError: function(e) { Android.onError(e.data); }
        }
      });
    }
    function playVideo()  { player && player.playVideo(); }
    function pauseVideo() { player && player.pauseVideo(); }
    function seekTo(s)    { player && player.seekTo(s, true); }
    function getCurrentTime() { return player ? player.getCurrentTime() : 0; }
    function getDuration()    { return player ? player.getDuration() : 0; }
  </script>
</head>
<body><div id="player"></div></body>
</html>
